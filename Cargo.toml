[package]
name = "ump"
authors = ["yuinshielAs <u5h10n04@s1nc3r34dv1c3.com>"]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yuiAs/ump"

[features]
default = ["wgpu-backend"]
d2d = ["dep:windows"]
wgpu-backend = ["dep:wgpu", "dep:glyphon", "dep:bytemuck", "dep:pollster"]

[dependencies]
midly = "0.5"
rustysynth = { git = "https://github.com/yuiAs/rustysynth", branch = "develop" }
cpal = "0.15"
winit = "0.30"
windows = { version = "0.58", optional = true, features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
] }
wgpu = { version = "25", optional = true }
glyphon = { version = "0.9", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "5"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
