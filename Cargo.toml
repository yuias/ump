[package]
name = "ump"
authors = ["yuinshielAs <u5h10n04@s1nc3r34dv1c3.com>"]
version = "0.4.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/yuiAs/ump"

[workspace]
members = ["crates/ump-playback"]

[workspace.dependencies]
anyhow = "1"
log = "0.4"
midly = "0.5"
rustysynth = { git = "https://github.com/yuiAs/rustysynth", branch = "develop" }

[features]
default = ["wgpu-backend"]
d2d = ["dep:windows", "dep:windows-numerics"]
wgpu-backend = ["dep:wgpu", "dep:glyphon", "dep:bytemuck", "dep:pollster"]

[dependencies]
ump-playback = { path = "crates/ump-playback" }
log = { workspace = true }
cpal = "0.18"
winit = "0.30"
windows = { version = "0.62", optional = true, features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
] }
windows-numerics = { version = "0.3", optional = true }
wgpu = { version = "30", optional = true }
glyphon = { version = "0.12", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "1", optional = true }
clap = { version = "4", features = ["derive"] }
anyhow = { workspace = true }
dirs = "7"
toml = "1"
serde = { version = "1", features = ["derive"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
