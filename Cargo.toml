[package]
name = "ump"
authors = ["yuinshielAs <u5h10n04@s1nc3r34dv1c3.com>"]
version = "0.6.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/yuiAs/ump"

[workspace]
members = ["crates/ump-playback"]
exclude = ["vendor/glyphon"]

[workspace.dependencies]
anyhow = "1"
encoding_rs = "0.8"
log = "0.4"
midly = "0.5"
rustysynth = { git = "https://github.com/yuiAs/rustysynth", branch = "develop" }
serde = { version = "1", features = ["derive"] }

[features]
default = ["wgpu-backend"]
wgpu-backend = ["dep:wgpu", "dep:glyphon", "dep:bytemuck", "dep:pollster"]

[dependencies]
ump-playback = { path = "crates/ump-playback", features = ["serde"] }
log = { workspace = true }
cpal = "0.18"
winit = "0.30"
wgpu = { version = "30", optional = true }
glyphon = { version = "0.12", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "1", optional = true }
clap = { version = "4", features = ["derive"] }
anyhow = { workspace = true }
dirs = "7"
toml = "1"
serde = { workspace = true }
unicode-width = "0.2"

# In-tree copy of glyphon 0.12.0 so its shader can be modified locally.
[patch.crates-io]
glyphon = { path = "vendor/glyphon" }

[profile.release]
opt-level = 3
lto = true
strip = true
